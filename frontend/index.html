 <!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IdeaHub | Pitch. Vote. Build </title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"/>

<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            colors: { brand: '#6366f1' },
            animation: {
                floatSlow: "floatSlow 8s ease-in-out infinite",
                fadeUp: "fadeUp 1s ease forwards",
            },
            keyframes: {
                floatSlow: {
                    "0%,100%": { transform: "translateY(0px)" },
                    "50%": { transform: "translateY(-15px)" }
                },
                fadeUp: {
                    "0%": { opacity: 0, transform: "translateY(30px)" },
                    "100%": { opacity: 1, transform: "translateY(0)" }
                }
            }
        }
    }
}
</script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: radial-gradient(circle at 30% 20%, #08080c, #010102 80%);
    color: white;
    margin: 0;
    overflow-x: hidden;
}

/* 🌌 BACKGROUND SYSTEM */
.background-container {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
}

/* GRID (more subtle + premium) */
.grid-layer {
    position: absolute;
    inset: 0;
    background-image: 
        linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 70px 70px;
    transform: perspective(1000px) rotateX(65deg) scale(1.6);
    opacity: 0.15;
}

/* 🔥 FLOATING BLOBS */
.blob {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    filter: blur(140px);
    opacity: 0.25;
    animation: blobMove 25s ease-in-out infinite alternate;
}

.blob1 { background: #6366f1; top: -100px; left: -100px; }
.blob2 { background: #ec4899; bottom: -100px; right: -100px; }

@keyframes blobMove {
    0% { transform: translate(0,0) scale(1); }
    100% { transform: translate(120px,80px) scale(1.3); }
}

/* 🧠 NOISE */
.noise {
    position: absolute;
    inset: 0;
    background-image: url("https://grainy-gradients.vercel.app/noise.svg");
    opacity: 0.04;
}

/* ⚡ SPOTLIGHT */
.spotlight {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle 500px at var(--x, 50%) var(--y, 50%), rgba(99,102,241,0.12), transparent 70%);
}

/* 💎 LIGHT SWEEP */
.light-reflection {
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,0.06), transparent 60%);
    animation: shine 8s linear infinite;
}

@keyframes shine {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}

/* TEXT */
.text-gradient {
    background: linear-gradient(to bottom right, #ffffff 20%, #71717a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* BUTTON */
.cta-button {
    background: linear-gradient(135deg,#ffffff,#d4d4d8);
    color: black;
    transition: all 0.4s ease;
    box-shadow: 0 0 20px rgba(255,255,255,0.1);
}
.cta-button:hover {
    background: linear-gradient(135deg,#6366f1,#8b5cf6);
    color: white;
    transform: translateY(-3px) scale(1.06);
    box-shadow: 0 15px 40px rgba(99,102,241,0.5);
}

/* NAV HOVER */
nav a:hover {
    color: #fff;
    transform: translateY(-1px);
}

/* SCROLL SMOOTH */
html {
    scroll-behavior: smooth;
}

/* media query */
@media (max-width: 640px) {

    /* Make blobs smaller */
    .blob {
        width: 280px;
        height: 280px;
        filter: blur(100px);
        opacity: 0.2;
    }

    /* Push blobs more to corners */
    .blob1 {
        top: -120px;
        left: -120px;
    }

    .blob2 {
        bottom: -120px;
        right: -120px;
    }

    /* Darken center again */
    body {
        background: radial-gradient(circle at 50% 40%, #020203, #000000 85%);
    }

    /* Reduce grid intensity */
    .grid-layer {
        opacity: 0.08;
        background-size: 50px 50px;
    }
}


</style>
</head>

<body>

<!-- 🌌 BACKGROUND -->
<div class="background-container">
    <div class="grid-layer"></div>
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="noise"></div>
    <div class="spotlight" id="spotlight"></div>
    <div class="light-reflection"></div>
</div>

<!-- NAV -->
 <nav class="flex justify-between items-center px-8 py-6 relative z-50 bg-black/40 backdrop-blur-xl border-b border-white/5">
    <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-brand rounded-xl flex items-center justify-center shadow-[0_0_20px_rgba(99,102,241,0.6)] animate-floatSlow">
            <i class="ri-lightbulb-flash-line text-xl"></i>
        </div>
        <h1 class="text-xl font-bold uppercase tracking-[0.2em]">ideahub</h1>
    </div>

   
</nav>

<!-- HERO -->
<header class="flex flex-col items-center justify-center text-center px-6 min-h-[80vh] relative z-10">

    <h1 class="text-6xl md:text-8xl font-extrabold leading-tight mb-6 text-gradient animate-fadeUp">
        Pitch ideas you can't <br>
        <span class="text-zinc-500 italic">stop thinking about.</span>
    </h1>

    <p class="text-zinc-400 max-w-xl mb-8 animate-fadeUp" style="animation-delay:0.2s">
        A high-signal ecosystem where ideas become reality.
    </p>

    <a href="https://ideahub-1-woki.onrender.com/login" class="cta-button px-10 py-4 rounded-full font-bold animate-fadeUp" style="animation-delay:0.4s">
        Get Started →
    </a>

</header>

<footer class="text-center py-10 text-zinc-600 relative z-10">
    Built for the Digital Architect
</footer>

<!-- JS -->
<script>
const spotlight = document.getElementById("spotlight");

window.addEventListener("mousemove", (e) => {
    spotlight.style.setProperty("--x", e.clientX + "px");
    spotlight.style.setProperty("--y", e.clientY + "px");
});
</script>

</body>
</html>
